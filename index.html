<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">
    <h1>Contactez-nous</h1>

    <form onsubmit="envoyerWhatsApp(); return false;">

        <input type="text" id="nom" placeholder="Votre nom" required>

        <input type="tel" id="telephone" placeholder="Votre téléphone" required>

        <textarea id="message" placeholder="Votre demande" required></textarea>

        <button type="submit">Envoyer sur WhatsApp</button>

    </form>
</div>

<script src="script.js"></script>

</body>
</html>
